name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SOLUTION_FILE: LinuxGate.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="Any CPU" /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinuxGate-${{ env.BUILD_CONFIGURATION }}
          path: |
            bin/${{ env.BUILD_CONFIGURATION }}/*.exe
            bin/${{ env.BUILD_CONFIGURATION }}/*.dll
            bin/${{ env.BUILD_CONFIGURATION }}/*.config
          retention-days: 30

  build-debug:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build solution (Debug)
        run: msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=Debug /p:Platform="Any CPU" /m

  release:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="Any CPU" /m

      - name: Create release archive
        run: |
          Compress-Archive -Path bin/${{ env.BUILD_CONFIGURATION }}/* -DestinationPath LinuxGate-${{ github.sha }}.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxGate-release-${{ github.sha }}
          path: LinuxGate-${{ github.sha }}.zip
          retention-days: 90
